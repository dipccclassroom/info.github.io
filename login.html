<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — DIPCC Classroom</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <div class="login-card">
    <h1>&#x1F393; DIPCC Classroom</h1>
    <p>Sign in to access classroom information.</p>
    <div class="role-tabs">
      <div class="role-tab active" id="tab-viewer" data-role="viewer">Student / Viewer</div>
      <div class="role-tab" id="tab-admin" data-role="admin">Admin</div>
    </div>
    <label for="password">Password</label>
    <input type="password" id="password" placeholder="Enter password" autofocus>
    <button class="btn-primary" id="login-btn" type="button">Sign In</button>
    <div class="error-msg" id="error-msg">Incorrect password. Please try again.</div>
  </div>
  <script src="auth-config.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
